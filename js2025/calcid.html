<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script>

        function doOpration(){
            let num1 = parseInt(document.getElementById("num1").value);
            let num2 = parseInt(document.getElementById("num2").value);
            let Opration = document.getElementById("Opration").value;

            if(Opration == "Addition"){
                ans = num1 + num2;
            }else if(Opration == "Subtraction"){
                ans = num1 - num2;
            }else if(Opration == "Division"){
                ans = num1 / num2;
            }else if(Opration == "Multiplication"){
                ans = num1 * num2;
            }else{
                ans = "Invalid Choice"
            }

            document.getElementById("solution").innerText = ans;
        }

    </script>
</head>
<body>

    <h2>Calculator</h2>

    Enter Number 1 : <input type="text" id="num1" />
    <br><br>
    Enter Number 2 : <input type="text" id="num2" />
    <br><br>

    Opration : <Select id="Opration">
        <option>---SELECT AN OPRATION---</option>
        <option>Addition</option>
        <option>Subtraction</option>
        <option>Division</option>
        <option>Multiplication</option>
    </Select>
    <br><br>

    <input type="button" value="Sumbit" onclick="doOpration()"/>
    <br><br>
    
    <div id="solution"></div>

</body>
</html>
