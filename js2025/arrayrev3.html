<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let arr = [100, 20, 30, 40, 50, 60, 70,];
        let max = arr[0];
        let min;
        for(i = 0; i < arr.length; i++){
            if(arr[i] > max){
                min = arr[i] - max;
                max = arr[i];
            }
        }
        console.log("max : " + max);
        console.log("min : " + min);

    </script>

</body>

</html>
