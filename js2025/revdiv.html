<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        let num = 86;

        if(num % 3 == 0){
            console.log(num + " is Divisible by 3!!");
        }else if(num % 10 == 0){
            console.log(num + " is Divisible by 10!!");
        }else if(num % 3 == 0 && num % 10 == 0){
            console.log(num + " is Divisible by both 3 and 10!!");
        }else{
            console.log(num + " is Nither Divisible by 3 Nor Divisible by 10!!");
        }

    </script>
    
</body>
</html>
