<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Login</title>
</head>

<body>

    <h2>Login Required</h2>

    Enter Your Name : <input type="text" id="name" /><br><br>
    Enter Your Mobile Number : <input type="text" id="mobNum" /><br><br>

    <input type="button" value="Login" onclick="fnLogin()">

    <script>

        function fnLogin() {
            let tmpName = document.getElementById("name").value;
            let tmpMobNum = document.getElementById("mobNum").value;

            localStorage.setItem("Name",tmpName);
            localStorage.setItem("MobileNum",tmpMobNum);

            location.href = "QuizHome.html";

        } 
    </script>

</body>

</html>
