<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script>

        function Voting(){

            Year = parseInt(document.Vote.Year.value);
            Age = parseInt(document.Vote.Age.value);

            if (Age >= 18) {
                document.write("<font size='70'>You are Eligible for Voting</font>");
                document.bgColor = "green";
            } else {
                document.write("<font size='70'>You are Not Eligible for Voting</font>");
                document.bgColor = "red";
            }

        }
    </script>
</head>

<body>

    <form name="Vote">

        <label>Enter Your Birth Year : </label>
        <br>
        <input type="number" name="Year"/>
        <br><br>
        <label>Enter Your Age : </label>
        <br>
        <input type="number" name="Age"/>
        <br><br>
        <button type="button" name="Sumbit" onclick="Voting()">Sumbit</button>

    </form>

</body>

</html>
