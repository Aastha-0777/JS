<body>
    
    <script>
        let a = [11,33,54,76,87,12,44];
        
        let oddArr = a.filter( temp => temp % 2 != 0);
        let evenArr = a.filter( temp => temp % 2 == 0);

        console.log("EvenArr : " + evenArr);
        console.log("OddArr : " + oddArr);

    </script>

</body>
