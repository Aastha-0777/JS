<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Over</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #2b0000, #660000);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 400px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            color: #ff4d4d;
        }

        p {
            font-size: 1.1rem;
            margin-top: 10px;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background: #ff3333;
            color: #fff;
            transition: 0.3s;
        }

        button:hover {
            background: #cc0000;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>GAME OVER</h1>
        <p>You fought bravely, but this journey ends here.</p>
        <div id="printScore"></div>
        <button onclick="restartGame()">Try Again</button>
    </div>


    <script>
        let score = localStorage.getItem("Score");
        document.getElementById("printScore").innerHTML = "Your Score : " + score;
        function restartGame() {
            window.location.href = "DimaondGame.html";
            localStorage.clear("Score");
        }
    </script>
</body>

</html>
