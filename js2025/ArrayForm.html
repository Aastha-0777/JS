<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <script>
        let a = [];
        function pushArray() {

            let num = parseInt(document.getElementById("num").value);

            a.push(num);

            document.getElementById("disArray").innerHTML = "The Array is : " + a;

            console.log(a);

        }

        function displayMax() {

            let i = 0;
            let max = 70;

            for (i = 0; i < a.length; i++) {
                if (a[i] > max) {
                    max = a[i];
                }
            }

            document.getElementById("disMax").innerHTML = "The Max Value of Array is : " + max;

        }

    </script>
</head>

<body>

    Enter a Number for Array : <input type="text" id="num" />
    <br><br>
    <input type="button" value="Submit" onclick="pushArray()" />
    <input type="button" value="Max" onclick="displayMax()" />
    <br><br>


    <div id="disArray"></div>
    <div id="disMax"></div>

</body>

</html>
