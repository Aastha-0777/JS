<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quote Generator</title>
  <style>

    body {
      font-family: Poppins, Arial, sans-serif;
      background: #f2f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 28px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      width: 380px;
      text-align: center;
    }
    h2 { margin: 0 0 14px; color:#203b4a; }
    label { font-weight:600; display:block; margin-bottom:6px; }
    select { width:100%; padding:8px 10px; border-radius:6px; border:1px solid #d6dbe3; margin-bottom:12px; }
    button {
      background:#0b78ff; color:#fff; border:none; padding:10px 16px; border-radius:6px;
      cursor:pointer; font-weight:600;
    }
    button:hover{ opacity:0.92; }
    #disQuote {
      margin-top:18px;
      font-style:italic;
      color:#555;
      min-height:48px;
      padding:10px;
      background: #f7fbff;
      border-radius:6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Random Quote Generator</h2>

    <label for="category">Select Category :</label>
    <select id="category">
      <option value="select">---Select---</option>

      <option value="success">Success</option>
      <option value="motivation">Motivation</option>
      <option value="career">Career</option>
      <option value="technology">Technology</option>
    </select>

    <button onclick="fnGenerateQuote()">Generate Quote</button>

    <div id="disQuote"></div>
  </div>

  <script>
    const quotes = {
      success: [
        "Success starts the moment you decide to stop making excuses.",
        "Dream big, start small, move fast — that’s how success grows.",
        "Every expert was once a beginner who refused to quit.",
        "Success isn’t a destination; it’s a habit repeated daily.",
        "The higher you climb, the more humble you must become.",
        "Winning once means luck. Winning consistently means discipline.",
        "If you’re not failing, you’re not growing.",
        "Real success is when you no longer need to prove anything to anyone.",
        "Measure success not by applause, but by impact.",
        "Be so consistent that success has no choice but to find you."
      ],
      motivation: [
        "When you feel like quitting, remember why you started.",
        "Motivation gets you started; discipline keeps you going.",
        "You don’t need to be extreme — just consistent.",
        "The pain you feel today builds the strength you’ll use tomorrow.",
        "Small steps every day lead to massive change over time.",
        "You don’t have to be the best, just better than yesterday.",
        "Storms make roots stronger — embrace the struggle.",
        "Stop waiting for the perfect moment; start and make it perfect.",
        "One hour of focused work beats ten hours of distraction.",
        "Progress is silent — let your results make the noise."
      ],
      career: [
        "Build a career that feels like purpose, not punishment.",
        "Your growth begins where your comfort ends.",
        "Skills age slower than trends — invest in learning.",
        "Don’t just work for money; work for mastery.",
        "The best careers are designed, not discovered.",
        "Opportunities don’t come — you create them with consistency.",
        "Stay curious — it’s the best career insurance you’ll ever have.",
        "Your network is your mirror — surround yourself with growth-minded people.",
        "Be the person who solves problems, not the one who complains about them.",
        "A job gives you experience, but passion gives you excellence."
      ],
      technology: [
        "Technology is best when it makes us more human, not less.",
        "Innovation starts with curiosity and grows through courage.",
        "Code is today’s language of creation — learn to speak it fluently.",
        "The future belongs to those who can learn, unlearn, and relearn.",
        "Don’t just use technology — understand it, shape it, improve it.",
        "Automation replaces effort, not imagination.",
        "Every line of code is a chance to change the world a little.",
        "Technology doesn’t wait — neither should your learning.",
        "Data is power, but wisdom is knowing how to use it.",
        "Behind every great innovation is someone who refused to accept limits."
      ]
    };

    function fnGenerateQuote() {
      const raw = document.getElementById("category").value;
     
      if (!raw || raw === "select") {
        document.getElementById("disQuote").textContent = "Please choose a category first.";
        return;
      }

   
      const selectedQuotes = quotes[raw];
  
      if (!Array.isArray(selectedQuotes) || selectedQuotes.length === 0) {
        document.getElementById("disQuote").textContent = "No quotes available for this category.";
        return;
      }

      const randomIndex = Math.floor(Math.random() * selectedQuotes.length);
      document.getElementById("disQuote").textContent = selectedQuotes[randomIndex];
    }
  </script>

</body>
</html>
