<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Fruit Game</title>
</head>

<style>
    body {
        text-align: center;
        background-color: #fff8e1;
        font-family: "Poppins", sans-serif;
        padding: 50px;
    }

    h1 {
        color: #ff6f00;
    }

    input {
        padding: 10px;
        font-size: 18px;
        text-transform: lowercase;
        margin: 10px;
    }

    button {
        padding: 10px 20px;
        background-color: #ff6f00;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    button:hover {
        background-color: #ff8f00;
    }

    #message {
        font-size: 20px;
        margin-top: 20px;
    }
</style>

<body>
    <h1>Guess the Fruit</h1>

    <p>Type your guess below:</p>

    <input type="text" id="guessInput" placeholder="Enter fruit name">
    <button id="guessBtn" onclick="checkGuess()">Guess</button>

    <p id="message"></p>
    <button id="restartBtn" onclick="restartGame()">Restart</button>

    <script>
GusseFruitGame.html
        let fruits = ["apple", "banana", "mango", "orange", "grapes", "peach"];

        let secretFruit = "";

        function startGame() {
            secretFruit = fruits[Math.floor(Math.random() * fruits.length)];
            document.getElementById("message").textContent = "";
            document.getElementById("guessInput").value = "";
            console.log("Secret fruit (for testing):", secretFruit);
        }

        function checkGuess() {
            const guess = document.getElementById("guessInput").value.toLowerCase();

            if (guess === "") {
                document.getElementById("message").textContent = "Please enter a fruit name!";
                return;
            }

            if (guess === secretFruit) {
                document.getElementById("message").innerHTML =
                    "Correct! The fruit was " + secretFruit.toUpperCase() + "!";
            } else {
                document.getElementById("message").innerHTML = "Wrong! Try again!";
            }
        }

        function restartGame() {
            startGame();
        }


        startGame();

    </script>

</body>

</html>
