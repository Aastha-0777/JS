<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Win</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #003314, #00b359);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 400px;
            padding: 20px;
            background: rgba(0, 40, 20, 0.4);
            border-radius: 16px;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            color: #00ff99;
            text-shadow: 0 0 10px #00ff99;
        }

        p {
            font-size: 1.1rem;
            margin-top: 10px;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background: #00e68a;
            color: #003314;
            transition: 0.3s;
        }

        button:hover {
            background: #00cc7a;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>YOU WIN!</h1>
        <p>Congratulations! You conquered the challenge.</p>
        <button onclick="goHome()">Play Again</button>
    </div>


    <script>
        function goHome() {
            window.location.href = "DimaondGame.html";
        }
    </script>
</body>

</html>
