<!DOCTYPE html>
<html lang="en">
<head>
    
    <script>

        var no1 = parseInt(prompt("Enter the Value for Number 1 : "));
        var no2 = parseInt(prompt("Enter the Value for Number 2 : "));

        document.write("<h1> Number 1 : ", no1, "</h1>");
        document.write("<h1> Number 2 : ", no2, "</h1>");

        var ans = no1 + no2;

        document.write("<h1> Sum : ", ans, "</h1>");

    </script>

</head>
<body>
    
</body>
</html>
